    - "Compras de combustible en Junín"
    - "Servicios de seguridad y vigilancia en Piura"
    - "Compra de aviones de combate F-35"
  explicacion_ia: >-
    Lee también el texto de la IA: puede indicar que ningún proceso coincide exactamente con lo que
    pediste (solo hay parecidos) aunque el sistema lo muestre como respuesta.
  novedades_aviso: >-
    NOVEDADES RECIENTES: procesos de septiembre de 2026 traídos por la API (mes en curso, aún sin
    archivo mensual cerrado). No están validados como el corpus y NO entran en los indicadores,
    el mapa ni el buscador. El departamento se asignó por la misma entidad en junio–agosto.

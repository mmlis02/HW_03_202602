  nota_monto: "El monto total suma solo los procesos con monto publicado; excluye {n:,} procesos sin monto."
  nota_reconvocatorias: "Incluye {s} de convocatorias anteriores de procesos reconvocados ({n:,}); sin ellas: {t}."
  nota_riesgo_kpi: "Adjudicaciones competitivas con un solo postor (bandera R018 de Open Contracting). Es una alerta, no una prueba."
  ejemplos:
